<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>monaco-editor-nls-adapter 语言切换 Demo</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #1e1e1e;
      color: #d4d4d4;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 20px;
      background: #252526;
      border-bottom: 1px solid #333;
    }
    header h1 {
      font-size: 16px;
      font-weight: 600;
      margin: 0;
    }
    header label { font-size: 13px; color: #9e9e9e; }
    select {
      background: #3c3c3c;
      color: #d4d4d4;
      border: 1px solid #555;
      border-radius: 4px;
      padding: 5px 8px;
      font-size: 13px;
      outline: none;
      cursor: pointer;
    }
    #status {
      margin-left: auto;
      font-size: 12px;
      color: #6a9955;
    }
    #tips {
      padding: 8px 20px;
      font-size: 12px;
      color: #9e9e9e;
      background: #2d2d2d;
      border-bottom: 1px solid #333;
    }
    #tips kbd {
      background: #3c3c3c;
      border: 1px solid #555;
      border-radius: 3px;
      padding: 1px 5px;
      font-size: 11px;
    }
    #editor { flex: 1; min-height: 0; }
  </style>
</head>
<body>
  <header>
    <h1>monaco-editor-nls-adapter Demo</h1>
    <label for="locale-select">界面语言 / UI Language:</label>
    <select id="locale-select">
      <option value="zh-hans">简体中文 (zh-hans)</option>
      <option value="zh-hant">繁體中文 (zh-hant)</option>
      <option value="en">English (en)</option>
      <option value="ja">日本語 (ja)</option>
      <option value="ko">한국어 (ko)</option>
      <option value="de">Deutsch (de)</option>
      <option value="fr">Français (fr)</option>
      <option value="es">Español (es)</option>
      <option value="it">Italiano (it)</option>
      <option value="ru">Русский (ru)</option>
      <option value="pl">Polski (pl)</option>
      <option value="tr">Türkçe (tr)</option>
      <option value="cs">Čeština (cs)</option>
      <option value="pt-br">Português - BR (pt-br)</option>
    </select>
    <span id="status"></span>
  </header>
  <div id="tips">
    在编辑器中 <strong>右键</strong> 打开上下文菜单，或按 <kbd>F1</kbd> 打开命令面板，即可看到本地化后的 UI 文案。切换语言后页面会自动重新加载以使新语言完整生效。
  </div>
  <div id="editor"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
